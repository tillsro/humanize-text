# Run all four Standard Pipeline steps on your Mac using Ollama.
# First download the models:
#   ollama pull qwen3.8:27b
#   ollama pull translategemma:27b
#   ollama pull hf.co/bartowski/utter-project_EuroLLM-22B-Instruct-2512-GGUF:Q4_K_M
# No API keys are required. See docs/ollama.md for setup and smaller models.

[general]
target_language = "en"
log_level = "info"

[llm]
# General multilingual model for the two humanizing rewrites.
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3.8:27b"
temperature = 1.3
timeout = 600

[translation]
# Shared connection and limits for the two independent translation models.
provider = "ollama"
base_url = "http://localhost:11434/v1"
timeout = 600
max_chunk_chars = 1000

[translation.step3]
# Japanese -> Finnish, replacing Google Translate.
model = "translategemma:27b"
prompt_style = "translategemma"

[translation.step4]
# Finnish -> English, replacing Niutrans with a different model family.
model = "hf.co/bartowski/utter-project_EuroLLM-22B-Instruct-2512-GGUF:Q4_K_M"
prompt_style = "plain"

[pipeline]
intermediate_lang = "fi"
