# Humanize-Text v1.5.1 Configuration

[general]
# Target language for final output
target_language = "en"
# Log level: debug, info, warning, error
log_level = "info"

[api_keys]
# DeepSeek API key (required when llm.provider = "deepseek")
deepseek_api_key = ""
# OpenRouter API key (required when llm.provider = "openrouter")
openrouter_api_key = ""
# Atlas Cloud API key (required when llm.provider = "atlascloud")
atlascloud_api_key = ""
# OrcaRouter API key (required when llm.provider = "orcarouter")
orcarouter_api_key = ""
# Niutrans API key (required for Step 4 when translation.provider = "google_niutrans")
niutrans_api_key = ""

[llm]
# LLM provider: "deepseek" | "openrouter" | "atlascloud" | "orcarouter" | "litellm" | "ollama"
provider = "deepseek"
# Override API base URL (empty = provider default)
base_url = ""
# Model slug (empty = provider default)
model = ""
# Temperature for LLM rewriting (1.3 recommended)
temperature = 1.3
# OpenRouter optional site attribution (for openrouter.ai rankings)
http_referer = ""
app_title = ""
# Optional request timeout in seconds (default: 120; Ollama: 600).
# timeout = 600

[pipeline]
# model / temperature kept for backward compat; [llm] takes precedence
model = "deepseek-chat"
temperature = 1.3
# Intermediate language for the cross-engine translation hop (Step 3 → Step 4).
# Finnish ("fi") is the default — agglutinative morphology forces deep
# restructuring before reconstruction to the target language.
# Other tested options: "de" (German), "ko" (Korean)
intermediate_lang = "fi"

[translation]
# Use "ollama" to replace Google Translate and Niutrans with local models.
# For a fully local setup, see config.ollama.example.toml and docs/ollama.md.
provider = "google_niutrans"
# Settings below apply only when provider = "ollama":
# model = "translategemma:27b"
# base_url = "http://localhost:11434/v1"
# timeout = 600
# max_chunk_chars = 1000

# Optional per-stage overrides for local translation:
# [translation.step3]
# model = "translategemma:27b"
# prompt_style = "translategemma"
# [translation.step4]
# model = "hf.co/bartowski/utter-project_EuroLLM-22B-Instruct-2512-GGUF:Q4_K_M"
# prompt_style = "plain"
